name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

# A new push to the same branch supersedes any run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # This repo uses npm, not pnpm. `ci` installs strictly from the lockfile
      # and fails if package.json and package-lock.json have drifted.
      - name: Install dependencies
        run: npm ci

      # Biome lint + format + assists. Also the gate for nursery/useExplicitType,
      # which is set to error — see AGENTS.md, TypeScript Standards.
      - name: Check navigation documentation
        run: node --test scripts/check-docs.test.mjs && node scripts/check-docs.mjs
      - name: Check formatting and lint
        run: npm run check

      # Expo Router's route union lives in .expo/types/, which is gitignored and so
      # never checked out. Without this step `Href` widens to `string | HrefObject`
      # and src/constants/routes.ts is validated against nothing. Expo documents this
      # command for type-checking on CI; it leaves tsconfig.json unchanged.
      - name: Generate router types
        run: npx expo customize tsconfig.json

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Test Play release safeguards
        run: npm run test:play-release
